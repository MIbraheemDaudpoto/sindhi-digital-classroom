version: '3.8'

services:
  sdc-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sdc-lms-production
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - DATABASE_PATH=/app/data/sdc_platform.db
      - SECRET_KEY=sdc-prod-secret-change-this-to-32-chars-long-key
      - CORS_ALLOWED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
      - AI_PROVIDER=auto
    volumes:
      # Persistent SQLite storage: ensures student progress & accounts survive container restarts
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

