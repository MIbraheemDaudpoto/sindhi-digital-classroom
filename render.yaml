services:
  - type: web
    name: sindhi-digital-classroom
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn src.api.app:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: data/sdc_platform.db
      - key: AI_PROVIDER
        value: auto
      - key: CORS_ALLOWED_ORIGINS
        value: https://sindhi-digital-classroom.onrender.com

